<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e163b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="tealPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.28" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.35" />
    </pattern>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Keyframes -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 5; fill-opacity: 0.9; }
        50% { r: 7.5; fill-opacity: 1; }
      }
      @keyframes funnelGrow {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.18); }
      }

      .pulse-bg-1 {
        transform-origin: 940px 190px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .pulse-bg-2 {
        transform-origin: 220px 80px;
        animation: pulseGlow 9s ease-in-out infinite 1.5s;
      }
      .float-container {
        animation: floatSlow 5.5s ease-in-out infinite;
      }
      .dash-anim {
        stroke-dasharray: 6, 6;
        animation: dashFlow 3.5s linear infinite;
      }
      .status-dot-1 { animation: pulseDot 2.8s ease-in-out infinite; }
      .status-dot-2 { animation: pulseDot 2.8s ease-in-out infinite 0.7s; }
      .status-dot-3 { animation: pulseDot 2.8s ease-in-out infinite 1.4s; }
      .status-dot-4 { animation: pulseDot 2.8s ease-in-out infinite 2.1s; }

      .bar-f1 { transform-origin: 960px 290px; animation: funnelGrow 4.2s ease-in-out infinite; }
      .bar-f2 { transform-origin: 995px 290px; animation: funnelGrow 3.6s ease-in-out infinite 0.5s; }
      .bar-f3 { transform-origin: 1030px 290px; animation: funnelGrow 4.8s ease-in-out infinite 1.1s; }
      .bar-f4 { transform-origin: 1065px 290px; animation: funnelGrow 3.9s ease-in-out infinite 0.3s; }
      .bar-f5 { transform-origin: 1100px 290px; animation: funnelGrow 4.5s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Background Ambient Orbs -->
  <circle class="pulse-bg-1" cx="940" cy="190" r="180" fill="url(#glowPulse)" />
  <circle class="pulse-bg-2" cx="220" cy="80" r="130" fill="url(#tealPulse)" />

  <!-- Background Decorative Dynamic Diagram: Automated Hiring Pipeline Funnel -->
  <g class="float-container" opacity="0.5">
    <!-- Connecting Workflow Curved Trajectory -->
    <path d="M 760 170 C 820 120, 890 220, 960 140 C 1020 70, 1090 180, 1150 120"
          fill="none" stroke="url(#flowGrad)" stroke-width="2.5" class="dash-anim" />

    <!-- Pipeline Stage Nodes (Sourcing -> Screening -> Matching -> Interview -> Offer) -->
    <!-- Node 1: Sourcing -->
    <g transform="translate(740, 155)">
      <rect width="40" height="30" rx="7" fill="#0f172a" stroke="#06b6d4" stroke-width="1.8" />
      <circle cx="20" cy="15" r="5" fill="#06b6d4" class="status-dot-1" />
    </g>
    <!-- Node 2: Screening -->
    <g transform="translate(835, 120)">
      <rect width="40" height="30" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="20" cy="15" r="5" fill="#38bdf8" class="status-dot-2" />
    </g>
    <!-- Node 3: Matching -->
    <g transform="translate(930, 150)">
      <rect width="40" height="30" rx="7" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
      <circle cx="20" cy="15" r="5" fill="#818cf8" class="status-dot-3" />
    </g>
    <!-- Node 4: Interview -->
    <g transform="translate(1025, 95)">
      <rect width="40" height="30" rx="7" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8" />
      <circle cx="20" cy="15" r="5" fill="#c084fc" class="status-dot-4" />
    </g>
    <!-- Node 5: Hired/Offer -->
    <g transform="translate(1120, 105)">
      <rect width="40" height="30" rx="7" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
      <circle cx="20" cy="15" r="5" fill="#10b981" class="status-dot-1" />
    </g>

    <!-- Funnel Volume Conversion Histogram Bars -->
    <rect class="bar-f1" x="955" y="210" width="16" height="80" rx="4" fill="#06b6d4" fill-opacity="0.8" />
    <rect class="bar-f2" x="990" y="230" width="16" height="60" rx="4" fill="#38bdf8" fill-opacity="0.8" />
    <rect class="bar-f3" x="1025" y="245" width="16" height="45" rx="4" fill="#818cf8" fill-opacity="0.85" />
    <rect class="bar-f4" x="1060" y="260" width="16" height="30" rx="4" fill="#c084fc" fill-opacity="0.9" />
    <rect class="bar-f5" x="1095" y="272" width="16" height="18" rx="4" fill="#10b981" fill-opacity="0.95" />
  </g>

  <!-- Foreground High-Contrast Typography & Information (Guaranteed Legibility) -->
  <g filter="url(#textShadow)">
    <!-- Pill Category Badge -->
    <g transform="translate(60, 48)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AI-POWERED TALENT ACQUISITION</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="140" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Recruitment Automation
    </text>

    <!-- Subtitle -->
    <text x="60" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">
      AI Sourcing, Candidate Screening, Talent Matching &amp; Hiring Workflows
    </text>

    <!-- Descriptive Line -->
    <text x="60" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400">
      Curated directory of enterprise SaaS suites, conversational agents, and open-source ATS pipelines.
    </text>

    <!-- Foreground Capability Badges -->
    <g transform="translate(60, 268)">
      <!-- Pill 1: AI Sourcing -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Autonomous Sourcing</text>
      </g>
      <!-- Pill 2: Resume Screening -->
      <g transform="translate(182, 0)">
        <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 AI Candidate Matching</text>
      </g>
      <!-- Pill 3: Open-Source ATS -->
      <g transform="translate(374, 0)">
        <rect width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📋 Open-Source ATS</text>
      </g>
      <!-- Pill 4: Voice & Chat Screening -->
      <g transform="translate(546, 0)">
        <rect width="190" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💬 Conversational Agents</text>
      </g>
    </g>

    <!-- Bottom Metadata Timestamp / Release Tag -->
    <g transform="translate(60, 335)">
      <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        UPDATED OCTOBER 2026 • SAAS &amp; OPEN-SOURCE DIRECTORY • COMMUNITY MAINTAINED
      </text>
    </g>
  </g>
</svg>